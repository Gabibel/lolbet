[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lolbet"
version = "0.1.0"
description = "Discord bot that tracks League of Legends games and runs a virtual parimutuel betting market on them."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "discord.py>=2.4,<3",
    "httpx>=0.27",
    "sqlmodel>=0.0.22",
    "aiosqlite>=0.20",
    "pydantic-settings>=2.4",
    "structlog>=24.1",
    # zoneinfo lit la base du systeme sous Linux mais n'a rien sous Windows :
    # le recap hebdomadaire doit tomber a la bonne heure locale des deux cotes.
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[project.scripts]
lolbet = "lolbet.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lolbet"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
